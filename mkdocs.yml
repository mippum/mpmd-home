site_name: 미쁨Edu ONLINE
site_description: Mippum's Home from MD Files
site_author: mippum

theme:
  name: material
  language: ko
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png

# 앱설정은 nav 에 항상 넣고, 네이티브 앱이 아닐 때 CSS 로 감춘다.
# (숨김 처리는 assets/webs/css/app-native.css, 판별은 overrides/main.html)
nav:
  - 홈: index.md
  - 서비스:
    - 듣기 트레이너: service/listening-trainer/index.md
    - 퀴즈: service/quiz/index.md
  - 전자책:
    - 자기긍정확언: epub/self-affirmation.md
    - 1문1답 영문전치사: epub/preposition.md
  - 앱설정: app-setting/index.md

extra_css:
  - assets/webs/css/app-native.css

extra_javascript:
  - assets/webs/js/app-native.js

markdown_extensions:
  - toc:
      permalink: true
  - footnotes
  - admonition
  - codehilite
  - pymdownx.superfences
  - pymdownx.tabbed

plugins:
  - search
  # - i18n:
  #     docs_structure: suffix
  #     languages:
  #       - name: 한국어
  #         locale: ko
  #         build: true
  #         default: true 
  #       - locale: en
  #         name: English
  #         build: true
  #         default: false
  #         site_name: "Documentation du plugin MkDocs static i18n (en)"
  #         site_description: "Description Française"

# 옵션: 배포 브랜치 설정 (기본값이 gh-pages)
# remote_branch: gh-pages

copyright:  © Mippum Edu Corporation. All rights reserved.

extra:
  generator: false
